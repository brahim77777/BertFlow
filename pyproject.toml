[project]
name = "bertflow"
version = "0.1.0"
requires-python = ">=3.13,<3.14"   # rag_rust.so is compiled for CPython 3.13
dependencies = [
    "websockets>=16.0,<17.0",
    "httpx",
    "diskcache>=5.6.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
